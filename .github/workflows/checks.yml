name: checks
# Runs on every pull request and on each push to main, except Markdown-only changes (a change to
# docs/integration-pair.json, which picks the controller the integration job runs against, still runs). A newer
# push to the same pull request cancels its older run; runs on main always finish.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: chmod -R go-rwx src
      - run: docker build -f ops/Dockerfile --target dependencies -t fri-dependencies:check .
      - run: docker build -f ops/Dockerfile --build-arg FRI_RELEASE_SHA=${{ github.sha }} -t fri-runtime:check .
      - run: docker run --rm --user 10001:10001 --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true fri-runtime:check python -c "import importlib,pkgutil,fri; [importlib.import_module('fri.'+m.name) for m in pkgutil.iter_modules(fri.__path__)]; assert importlib.util.find_spec('gene') is None; assert importlib.util.find_spec('redbot') is None"
      - run: docker run --rm --network none --read-only --user 0 fri-runtime:check python -c "from pathlib import Path; assert not Path('/root/.cache/uv').exists()"
      - name: Verify source-only rebuilds share the dependency layers
        run: |
          printf '\n# Source-only cache regression probe.\n' >> src/fri/fri.py
          docker build -f ops/Dockerfile --build-arg FRI_RELEASE_SHA=${{ github.sha }} -t fri-runtime:source-check .
          python3 - <<'PY'
          import json, subprocess
          def inspect(name):
              return json.loads(subprocess.check_output(['docker', 'image', 'inspect', name]))[0]
          dependencies = inspect('fri-dependencies:check')['RootFS']['Layers']
          layers = []
          for name in ('fri-runtime:check', 'fri-runtime:source-check'):
              image = inspect(name)
              assert image['Config']['User'] == '10001:10001', name
              assert image['Config']['Labels']['org.opencontainers.image.revision'] == '${{ github.sha }}', name
              current = image['RootFS']['Layers']
              assert current[:len(dependencies)] == dependencies, name
              layers.append(current)
          assert layers[0] != layers[1], 'probe did not rebuild the source layer'
          print('A source-only rebuild shares the dependency layers')
          PY
  integration:
    # The pinned integration and replay suites against the real controller, as scripts/offline-checks.sh runs them
    # locally: Gene is public, so its exact paired commit is fetched without credentials, and only setup uses the network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-integration-${{ runner.os }}-${{ hashFiles('uv.lock', 'docs/integration-pair.json') }}
          restore-keys: uv-integration-${{ runner.os }}-
      - name: Fetch the paired Gene commit
        run: |
          read -r repository commit < <(python3 -c "import json; pair = json.load(open('docs/integration-pair.json')); print(pair['controller_repository'], pair['verified_controller_commit'])")
          git init -q "$RUNNER_TEMP/gene"
          git -C "$RUNNER_TEMP/gene" fetch -q --depth 1 "https://github.com/$repository.git" "$commit"
      - name: Let the check deny the network with unshare -rn
        # Ubuntu's AppArmor blocks unprivileged user namespaces by default; the script then refuses to run.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn true
      - run: scripts/offline-checks.sh setup
        env:
          GENE_REPO: ${{ runner.temp }}/gene
      - run: scripts/offline-checks.sh check
