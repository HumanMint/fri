name: checks
# Private repos get a monthly allowance of Actions minutes: test each change once (a pull request, then its
# merge to main), skip Markdown-only changes (docs/integration-pair.json picks the controller the tests run against), and let a newer push to the same pull request cancel the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: chmod -R go-rwx src
      - run: docker build -f ops/Dockerfile --build-arg FRI_RELEASE_SHA=${{ github.sha }} -t fri-runtime:check .
      - run: docker run --rm --user 10001:10001 --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true fri-runtime:check python -c "import importlib,pkgutil,fri; [importlib.import_module('fri.'+m.name) for m in pkgutil.iter_modules(fri.__path__)]; assert importlib.util.find_spec('gene') is None; assert importlib.util.find_spec('redbot') is None"
